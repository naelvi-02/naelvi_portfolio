<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#0a0f1c;font-family:monospace;color:#7c9fff">
  <!-- Window Frame -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#7c9fff" stroke-width="4"/>
  <line x1="20" y1="80" x2="780" y2="80" stroke="#7c9fff" stroke-width="4"/>
  
  <text x="40" y="60" fill="#7c9fff" font-size="24" font-weight="bold">LUMINA STUDIO AI [ JEWELRY ]</text>
  
  <!-- Image Comparison Container -->
  <rect x="40" y="100" width="720" height="380" fill="#080c16" stroke="#253556" stroke-width="2"/>
  
  <!-- Before Side -->
  <rect x="40" y="100" width="360" height="380" fill="none" stroke="#253556" stroke-width="1"/>
  <text x="50" y="130" fill="#4b689c" font-size="16">RAW_INPUT.JPG</text>
  <circle cx="220" cy="290" r="80" fill="none" stroke="#4b689c" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="160" y="295" fill="#4b689c" font-size="14">NOISE / LOW LIGHT</text>
  
  <!-- After Side -->
  <rect x="400" y="100" width="360" height="380" fill="none"/>
  <text x="410" y="130" fill="#7c9fff" font-size="16">STUDIO_RENDER_FINAL.JPG</text>
  <circle cx="580" cy="290" r="80" fill="none" stroke="#7c9fff" stroke-width="4"/>
  <circle cx="580" cy="290" r="70" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="525" y="295" fill="#ffffff" font-size="14">STUDIO LIGHTING</text>
  
  <!-- Split Line -->
  <line x1="400" y1="100" x2="400" y2="480" stroke="#7c9fff" stroke-width="4"/>
  <circle cx="400" cy="290" r="15" fill="#7c9fff"/>
  <text x="393" y="295" fill="#0a0f1c" font-size="16" font-weight="bold">&gt;</text>
  
  <!-- Controls -->
  <rect x="40" y="500" width="720" height="60" fill="none" stroke="#253556" stroke-width="2"/>
  <text x="60" y="535" fill="#7c9fff" font-size="14">MODEL: GEMINI_FLASH_ENHANCE_V2</text>
  <rect x="580" y="510" width="160" height="40" fill="#7c9fff"/>
  <text x="600" y="535" fill="#0a0f1c" font-size="16" font-weight="bold">PROCESS IMAGE</text>
</svg>
